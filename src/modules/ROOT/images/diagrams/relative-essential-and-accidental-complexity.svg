<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="320px" height="312px" viewBox="-0.5 -0.5 320 312">
    <title>Two boxes, each labelled with one kind of complexity and containing a smaller box labelled with the other</title>
    <g>
        <rect x="1" y="1" width="143" height="143" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="72" y="32" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="72" dy="-8">Essential</tspan>
            <tspan x="72" dy="16">Complexity</tspan>
        </text>
        <rect x="84" y="84" width="48" height="48" fill="currentColor" stroke="currentColor" stroke-width="2"/>
        <path d="M 191 108 L 132 108" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="239" y="108" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="239" dy="-8">Accidental</tspan>
            <tspan x="239" dy="16">Complexity</tspan>
        </text>
        <rect x="1" y="168" width="143" height="143" fill="currentColor" stroke="currentColor" stroke-width="2"/>
        <text x="72" y="199" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="var(--base-page, #ffffff)">
            <tspan x="72" dy="-8">Accidental</tspan>
            <tspan x="72" dy="16">Complexity</tspan>
        </text>
        <rect x="84" y="251" width="48" height="48" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <path d="M 191 275 L 144 275" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="239" y="275" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="239" dy="-8">Essential</tspan>
            <tspan x="239" dy="16">Complexity</tspan>
        </text>
        <path d="M 144 275 L 132 275" fill="none" stroke="var(--base-page, #ffffff)" stroke-width="2" stroke-dasharray="2 4"/>
    </g>
</svg>
