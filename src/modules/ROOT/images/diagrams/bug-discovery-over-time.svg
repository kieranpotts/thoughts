        <text x="267" y="304" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">months since installation</text>
        <text x="16" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor" transform="rotate(-90 16 143)">bugs found per month</text>
