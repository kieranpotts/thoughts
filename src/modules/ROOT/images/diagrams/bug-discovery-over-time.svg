<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="500px" height="320px" viewBox="-0.5 -0.5 500 320">
    <title>A line chart of bugs found per month against months since installation, trending sharply downward before inflecting and trailing gently upward</title>
