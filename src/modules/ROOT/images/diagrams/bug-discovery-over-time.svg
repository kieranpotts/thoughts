<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="500px" height="320px" viewBox="-0.5 -0.5 500 320">
    <title>A line chart of bugs found per month against months since installation, trending sharply downward before inflecting and trailing gently upward</title>
    <g>
        <path d="M 100 280 L 100 6" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 494 280 L 100 280" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="297" y="304" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Months Since Installation</text>
        <text x="48" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="48" dy="-8">Bugs Found</tspan>
            <tspan x="48" dy="16">per Month</tspan>
        </text>
        <path d="M 114 6 Q 170 143 213 184 Q 254 225 311 225 Q 367 225 494 184" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
</svg>
